[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperkit"
version = "0.2.0"
description = "Conference grounding for agent-assisted paper writing"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [{ name = "Benjamin Kubwimana" }]
dependencies = []

[project.scripts]
pk = "paperkit.cli:main"
paperkit = "paperkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperkit"]

# The kit itself ships inside the wheel so `pk init` needs no network and the
# installed files always match the installed CLI version.
[tool.hatch.build.targets.wheel.force-include]
".paperkit" = "paperkit/assets/kit"
"skills" = "paperkit/assets/skills"
"AGENTS.md" = "paperkit/assets/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = ["src", ".paperkit", "skills", "AGENTS.md", "README.md", "LICENSE", "tests"]
